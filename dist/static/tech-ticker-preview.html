<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tech Ticker Section Preview</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
    color: #1a1a1a;
    background: #ffffff;
  }

  .site-container {
    width: 100%;
    max-width: 1120px;
    margin-left: auto;
    margin-right: auto;
    padding-left: 24px;
    padding-right: 24px;
  }

  .pretext {
    display: flex;
    align-items: center;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: bold;
    font-size: 14px;
  }

  h2 {
    line-height: 1.2;
  }

  p {
    font-size: 18px;
  }

  /* ===== Tech Ticker Section ===== */

  .tech-ticker-con {
    background: #14161c;
    padding: 60px 0;
    overflow: hidden;
  }

  .tech-ticker-header {
    max-width: 650px;
    margin-bottom: 36px;
  }

  .ticker-pretext {
    color: rgb(244 196 48);
  }

  .tech-ticker-header h2 {
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    margin-top: 10px;
    margin-bottom: 10px;
    color: white;
  }

  .tech-ticker-header p {
    color: #cbcfd8;
  }

  .ticker-viewport {
    position: relative;
    width: 100%;
    -webkit-mask-image: linear-gradient(
      to right,
      transparent 0,
      #000 80px,
      #000 calc(100% - 80px),
      transparent 100%
    );
    mask-image: linear-gradient(
      to right,
      transparent 0,
      #000 80px,
      #000 calc(100% - 80px),
      transparent 100%
    );
  }

  .ticker-track {
    display: flex;
    width: max-content;
    animation: scroll-left 28s linear infinite;
  }

  .ticker-track:hover {
    animation-play-state: paused;
  }

  .ticker-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 40px;
    white-space: nowrap;
    font-size: 22px;
    font-weight: 700;
    color: #5f6470;
    transition: color 0.25s;
  }

  .ticker-item:hover {
    color: white;
  }

  .ticker-item .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgb(255 90 31);
    flex-shrink: 0;
  }

  @keyframes scroll-left {
    from {
      transform: translateX(0);
    }
    to {
      transform: translateX(-50%);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .ticker-track {
      animation: none;
    }
  }
</style>
</head>
<body>

  <section class="tech-ticker-con">
    <div class="site-container">
      <div class="tech-ticker-header">
        <span class="pretext ticker-pretext">— MY TOOLKIT</span>
        <h2>The tech behind the sites I build</h2>
        <p>A modern front-end stack paired with real WordPress and backend experience.</p>
      </div>
    </div>

    <div class="ticker-viewport">
      <div class="ticker-track" id="tickerTrack">
        <!-- Set A -->
        <span class="ticker-item"><span class="dot"></span>React</span>
        <span class="ticker-item"><span class="dot"></span>JavaScript</span>
        <span class="ticker-item"><span class="dot"></span>WordPress</span>
        <span class="ticker-item"><span class="dot"></span>PHP</span>
        <span class="ticker-item"><span class="dot"></span>Node.js</span>
        <span class="ticker-item"><span class="dot"></span>Express</span>
        <span class="ticker-item"><span class="dot"></span>HTML5</span>
        <span class="ticker-item"><span class="dot"></span>CSS3</span>
        <span class="ticker-item"><span class="dot"></span>Git</span>
        <span class="ticker-item"><span class="dot"></span>Figma</span>
        <span class="ticker-item"><span class="dot"></span>Stripe</span>
        <span class="ticker-item"><span class="dot"></span>REST APIs</span>
        <!-- Set B (duplicate for seamless loop) -->
        <span class="ticker-item"><span class="dot"></span>React</span>
        <span class="ticker-item"><span class="dot"></span>JavaScript</span>
        <span class="ticker-item"><span class="dot"></span>WordPress</span>
        <span class="ticker-item"><span class="dot"></span>PHP</span>
        <span class="ticker-item"><span class="dot"></span>Node.js</span>
        <span class="ticker-item"><span class="dot"></span>Express</span>
        <span class="ticker-item"><span class="dot"></span>HTML5</span>
        <span class="ticker-item"><span class="dot"></span>CSS3</span>
        <span class="ticker-item"><span class="dot"></span>Git</span>
        <span class="ticker-item"><span class="dot"></span>Figma</span>
        <span class="ticker-item"><span class="dot"></span>Stripe</span>
        <span class="ticker-item"><span class="dot"></span>REST APIs</span>
      </div>
    </div>
  </section>

</body>
</html>
