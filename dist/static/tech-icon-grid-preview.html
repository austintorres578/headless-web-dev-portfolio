<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tech Icon Grid Section Preview</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
    color: #1a1a1a;
    background: #ffffff;
  }

  .site-container {
    width: 100%;
    max-width: 1120px;
    margin-left: auto;
    margin-right: auto;
    padding-left: 24px;
    padding-right: 24px;
  }

  .pretext {
    display: flex;
    align-items: center;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: bold;
    font-size: 14px;
  }

  h2 {
    line-height: 1.2;
  }

  p {
    font-size: 18px;
  }

  /* ===== Tech Icon Grid Section ===== */

  .tech-grid-con {
    background: #ffffff;
    padding: 80px 0;
  }

  .tech-grid-header {
    max-width: 650px;
    margin-bottom: 50px;
    text-align: left;
  }

  .grid-pretext {
    color: rgb(31 122 224);
  }

  .tech-grid-header h2 {
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    margin-top: 10px;
    margin-bottom: 10px;
  }

  .tech-grid-header p {
    color: #5f6470;
  }

  .icon-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    border-top: 1px solid rgba(0, 0, 0, 0.08);
    border-left: 1px solid rgba(0, 0, 0, 0.08);
  }

  .icon-tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 32px 16px;
    border-right: 1px solid rgba(0, 0, 0, 0.08);
    border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    transition: background 0.2s;
  }

  .icon-tile:hover {
    background: #f7f6f2;
  }

  .icon-tile svg {
    width: 34px;
    height: 34px;
    fill: #888780;
    transition: fill 0.2s, transform 0.2s;
  }

  .icon-tile:hover svg {
    fill: #14161c;
    transform: translateY(-2px);
  }

  .icon-tile span {
    font-size: 13px;
    font-weight: 500;
    color: #5f6470;
  }

  @media (max-width: 780px) {
    .icon-grid {
      grid-template-columns: repeat(3, 1fr);
    }
  }

  @media (max-width: 480px) {
    .icon-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }
</style>
</head>
